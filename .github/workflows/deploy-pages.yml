name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # The weekly schedule commit is tagged [skip ci], which skips push
  # triggers, so also redeploy after each update-and-deploy run.
  workflow_run:
    workflows: ["Update schedules and deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # After a weekly run, only redeploy if it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Checks out the latest main, including any schedule data the weekly
      # run just committed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run web:build
        env:
          # Served from https://cookmcbook.github.io/IceTimeSchedule/ (read by app.config.js).
          EXPO_BASE_URL: /IceTimeSchedule

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
